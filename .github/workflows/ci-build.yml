name: Build

# Reusable workflow: builds, type-checks, lints and tests on Node 24, then
# uploads the publishable output (dist/ + generated jsonschema/) as an artifact.
# Called by both ci.yml (on push) and publish.yml (on release).
on:
  workflow_call:
    inputs:
      upload-artifact:
        description: 'Upload the build output as an artifact for a downstream publish job.'
        type: boolean
        default: false

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build, lint, and test on Node 24
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        env:
          FORCE_COLOR: 0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      # Type-checks dist/*.d.mts in throwaway consumer projects (skipLibCheck
      # off): the DOM-free entries without jquery or lottie-web, the main entry
      # with @types/jquery but without lottie-web. Needs the build above.
      - name: Check published declarations
        run: npm run check:types

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      # Specs that import the built package through its own exports map (one
      # build for eligius and eligius/runtime). Needs the build above.
      - name: Test published package
        run: npx vitest run --config src/vitest.published.config.ts

      # dist/ and jsonschema/ are git-ignored build output, so the publish job
      # consumes them via this artifact rather than rebuilding.
      - name: Upload package artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-dist
          path: |
            dist
            jsonschema
          retention-days: 1
          if-no-files-found: error
